# ESPHome component test configuration for BMI270
#
# This test configuration ensures the component compiles correctly
# with various sensor configurations.

esphome:
  name: test-bmi270
  platformio_options:
    build_flags: -DI2C_BUFFER_LENGTH=8193

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

i2c:
  - id: i2c_bus
    sda: 21
    scl: 22
    scan: false

# Test 1: All sensors enabled
sensor:
  - platform: bmi270
    address: 0x68
    update_interval: 60s
    acceleration_x:
      name: "Test Accel X"
    acceleration_y:
      name: "Test Accel Y"
    acceleration_z:
      name: "Test Accel Z"
    gyroscope_x:
      name: "Test Gyro X"
    gyroscope_y:
      name: "Test Gyro Y"
    gyroscope_z:
      name: "Test Gyro Z"
    field_strength_x:
      name: "Test Mag X"
    field_strength_y:
      name: "Test Mag Y"
    field_strength_z:
      name: "Test Mag Z"
    temperature:
      name: "Test Temp"

# Test 2: Minimal configuration (just one sensor)
  - platform: bmi270
    address: 0x68
    acceleration_x:
      name: "Test Minimal Accel X"

# Test 3: With filters
  - platform: bmi270
    address: 0x68
    update_interval: 5s
    acceleration_x:
      name: "Test Filtered Accel X"
      filters:
        - sliding_window_moving_average:
            window_size: 5
            send_every: 5
    gyroscope_x:
      name: "Test Filtered Gyro X"
      filters:
        - median:
            window_size: 3
