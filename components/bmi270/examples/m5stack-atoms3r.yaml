# M5Stack AtomS3R BMI270 Configuration
#
# Complete working configuration for M5Stack AtomS3R device
# with BMI270 IMU and BMM150 magnetometer.
#
# Hardware:
# - ESP32-S3 microcontroller
# - 128x128 LCD display (ILI9XXX ST7789V)
# - BMI270 6-axis IMU at I2C address 0x68
# - BMM150 magnetometer via BMI270 auxiliary interface
# - LP5562 LED driver for display backlight at I2C address 0x30
# - Button on GPIO 41

esphome:
  name: m5stack-atoms3r
  friendly_name: M5Stack AtomS3R
  platformio_options:
    # REQUIRED: Large I2C buffer for BMI270 configuration blob upload
    build_flags: -DI2C_BUFFER_LENGTH=8193

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

# Enable logging
logger:
  level: INFO
  logs:
    bmi270: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: !secret homeassistant_api_key

ota:
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot
  ap:
    ssid: !secret wifi_ap_name
    password: !secret wifi_ap_password

captive_portal:

# I2C Bus Configuration
# I2C Addresses:
#   0x30 = LP5562 / Display Backlight
#   0x68 = BMI270 / IMU (BMM150 at 0x10 via auxiliary interface)
i2c:
  sda: 45
  scl: 0
  scan: false  # Disable I2C scan to speed up boot time
  frequency: 400kHz

# BMI270 IMU Sensor with BMM150 Magnetometer
sensor:
  - platform: bmi270
    address: 0x68
    update_interval: 5s

    # Accelerometer
    acceleration_x:
      name: "IMU Accel X"
      id: imu_accel_x
      filters:
        - sliding_window_moving_average:
            window_size: 5
            send_every: 5
    acceleration_y:
      name: "IMU Accel Y"
      id: imu_accel_y
      filters:
        - sliding_window_moving_average:
            window_size: 5
            send_every: 5
    acceleration_z:
      name: "IMU Accel Z"
      id: imu_accel_z
      filters:
        - sliding_window_moving_average:
            window_size: 5
            send_every: 5

    # Gyroscope
    gyroscope_x:
      name: "IMU Gyro X"
      id: imu_gyro_x
      filters:
        - sliding_window_moving_average:
            window_size: 5
            send_every: 5
    gyroscope_y:
      name: "IMU Gyro Y"
      id: imu_gyro_y
      filters:
        - sliding_window_moving_average:
            window_size: 5
            send_every: 5
    gyroscope_z:
      name: "IMU Gyro Z"
      id: imu_gyro_z
      filters:
        - sliding_window_moving_average:
            window_size: 5
            send_every: 5

    # Magnetometer (BMM150)
    field_strength_x:
      name: "IMU Mag X"
      id: imu_mag_x
      filters:
        - median:
            window_size: 5
            send_every: 5
    field_strength_y:
      name: "IMU Mag Y"
      id: imu_mag_y
      filters:
        - median:
            window_size: 5
            send_every: 5
    field_strength_z:
      name: "IMU Mag Z"
      id: imu_mag_z
      filters:
        - median:
            window_size: 5
            send_every: 5

    # Temperature
    temperature:
      name: "IMU Temperature"
      id: imu_temp

# Button (GPIO 41)
binary_sensor:
  - platform: gpio
    name: "Button"
    id: main_button
    pin:
      number: 41
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_off: 10ms
    on_press:
      then:
        - logger.log: "Button pressed"
    on_double_click:
      then:
        - logger.log: "Button double clicked"
    on_multi_click:
      - timing:
        - ON for at least 1s
        then:
          - logger.log: "Button hold"

# Display backlight output (LP5562)
# Note: This requires the m5stack_display_backlight_output component
# Uncomment if you have the component available:
#
# output:
#   - platform: m5stack_display_backlight_output
#     id: displaybacklightoutput
#
# light:
#   - platform: monochromatic
#     output: displaybacklightoutput
#     name: "Display Backlight"
#     id: displaybacklight
#     restore_mode: ALWAYS_ON
#     icon: mdi:television-ambient-light

# SPI Bus for Display
spi:
  clk_pin: 15
  mosi_pin: 21

# Display (128x128 ILI9XXX ST7789V)
display:
  - platform: ili9xxx
    model: st7789v
    id: display_tft
    dimensions:
      height: 128
      width: 128
      offset_height: 1
      offset_width: 2
    cs_pin: 14
    dc_pin: 42
    reset_pin: 48
    invert_colors: true
    rotation: 0
    lambda: |-
      // Display IMU sensor values
      it.printf(5, 5, id(font_small), "Accel X: %.2f m/s²", id(imu_accel_x).state);
      it.printf(5, 25, id(font_small), "Accel Y: %.2f m/s²", id(imu_accel_y).state);
      it.printf(5, 45, id(font_small), "Accel Z: %.2f m/s²", id(imu_accel_z).state);
      it.printf(5, 75, id(font_small), "Gyro X: %.1f °/s", id(imu_gyro_x).state);
      it.printf(5, 95, id(font_small), "Gyro Y: %.1f °/s", id(imu_gyro_y).state);

# Font for display
font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 14
