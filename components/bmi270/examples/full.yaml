# Full BMI270 Configuration
#
# This example demonstrates all available sensors including
# accelerometer, gyroscope, magnetometer (BMM150), and temperature.

esphome:
  name: bmi270-full
  platformio_options:
    # REQUIRED: Large I2C buffer for BMI270 configuration blob upload
    build_flags: -DI2C_BUFFER_LENGTH=8193

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:
  level: DEBUG
  logs:
    bmi270: INFO

# Enable Home Assistant API
api:

ota:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot
  ap:
    ssid: "BMI270 Fallback"
    password: "12345678"

captive_portal:

# I2C Bus Configuration
i2c:
  sda: 21
  scl: 22
  scan: true
  frequency: 400kHz

# BMI270 Sensor - Full Configuration with All Sensors
sensor:
  - platform: bmi270
    address: 0x68
    update_interval: 5s

    # Accelerometer (±8g range)
    acceleration_x:
      name: "BMI270 Acceleration X"
      filters:
        - sliding_window_moving_average:
            window_size: 5
            send_every: 5
    acceleration_y:
      name: "BMI270 Acceleration Y"
      filters:
        - sliding_window_moving_average:
            window_size: 5
            send_every: 5
    acceleration_z:
      name: "BMI270 Acceleration Z"
      filters:
        - sliding_window_moving_average:
            window_size: 5
            send_every: 5

    # Gyroscope (±2000°/s range)
    gyroscope_x:
      name: "BMI270 Gyroscope X"
      filters:
        - sliding_window_moving_average:
            window_size: 5
            send_every: 5
    gyroscope_y:
      name: "BMI270 Gyroscope Y"
      filters:
        - sliding_window_moving_average:
            window_size: 5
            send_every: 5
    gyroscope_z:
      name: "BMI270 Gyroscope Z"
      filters:
        - sliding_window_moving_average:
            window_size: 5
            send_every: 5

    # Magnetometer (BMM150 via auxiliary interface)
    field_strength_x:
      name: "BMI270 Magnetic Field X"
      filters:
        - median:
            window_size: 5
            send_every: 5
    field_strength_y:
      name: "BMI270 Magnetic Field Y"
      filters:
        - median:
            window_size: 5
            send_every: 5
    field_strength_z:
      name: "BMI270 Magnetic Field Z"
      filters:
        - median:
            window_size: 5
            send_every: 5

    # Internal temperature sensor
    temperature:
      name: "BMI270 Temperature"
      filters:
        - offset: 0.0  # Adjust if needed for calibration
